
{% extends "base.html" %}

{% block content %}
<section class="section-page" dir="rtl">

    <div class="section-heading">
        <h1>إضافة قطعة أثرية</h1>
        <p>إدخال البيانات العلمية والتوثيقية للقطعة الأثرية.</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="artifact-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="inventory_number">رقم الجرد *</label>
            <input type="text" id="inventory_number" name="inventory_number" maxlength="100" required>
        </div>

        <div class="form-group">
            <label for="name_ar">اسم القطعة الأثرية *</label>
            <input type="text" id="name_ar" name="name_ar" maxlength="250" required>
        </div>

        <div class="form-group">
            <label for="description_ar">الوصف</label>
            <textarea id="description_ar" name="description_ar" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="period">الحقبة التاريخية</label>
            <input type="text" id="period" name="period" maxlength="150">
        </div>

        <div class="form-group">
            <label for="material">المادة المصنوع منها</label>
            <input type="text" id="material" name="material" maxlength="150">
        </div>

        <div class="form-group">
            <label for="discovery_location">مكان الاكتشاف</label>
            <input type="text" id="discovery_location" name="discovery_location" maxlength="250">
        </div>

        <div class="form-group">
            <label for="artifact_image">صورة القطعة الأثرية</label>
            <input
                type="file"
                id="artifact_image"
                name="artifact_image"
                accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
            >
            <small>الصيغ المسموحة: JPG وPNG وWEBP، والحد الأقصى 7 ميغابايت.</small>
        </div>

        <div class="form-actions">
            <button type="submit">حفظ القطعة الأثرية</button>
            <a href="{{ url_for('artifacts.index') }}">إلغاء</a>
        </div>

    </form>

</section>
{% endblock %}
