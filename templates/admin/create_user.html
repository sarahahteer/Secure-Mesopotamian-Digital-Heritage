
{% extends "base.html" %}

{% block title %}إضافة مستخدم جديد{% endblock %}

{% block content %}

<div class="page-header">
    <h2>إضافة مستخدم جديد</h2>
    <p>إنشاء حساب باحث جديد في منصة التراث الرقمي العراقي.</p>
</div>

<div class="card" style="max-width:650px; margin:25px auto; padding:25px;">

    <form method="POST" action="{{ url_for('admin.create_user') }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div style="margin-bottom:18px;">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username"
                   value="باحثه_اية" required maxlength="80">
        </div>

        <div style="margin-bottom:18px;">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" name="email"
                   required maxlength="255">
        </div>

        <div style="margin-bottom:18px;">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password"
                   minlength="12" required>
        </div>

        <div style="margin-bottom:18px;">
            <label for="confirm_password">تأكيد كلمة المرور</label>
            <input type="password" id="confirm_password"
                   name="confirm_password" minlength="12" required>
        </div>

        <div style="margin-bottom:20px;">
            <label>الدور الوظيفي</label>
            <input type="text" value="باحث أول (Senior Researcher)" readonly>
        </div>

        <button type="submit" class="btn-primary">
            إنشاء الحساب
        </button>

        <a href="{{ url_for('admin.users') }}">
            العودة إلى إدارة المستخدمين
        </a>

    </form>

</div>

{% endblock %}
